function isCur(d){
  const p=String(d||'').split(' ')[0];let y,m,a=p.split('/');
  if(a.length===3){m=+a[1];y=+a[2]}else{a=p.split('-');if(a.length!==3)return false;y=+a[0];m=+a[1]}
  const n=new Date();return m===n.getMonth()+1&&y===n.getFullYear();
}
function renderAll(){

    });
    $('tb-'+m.k).innerHTML=rows||`<tr><td colspan="6">${t.none}</td></tr>`;
    cmAll+=cm;

    $('tot-'+m.k).textContent=fmt(tot)+' BDT';
    gD+=tot;gT+=tg;
    front+=`<tr><td>${who}</td><td>${m.s}</td><td>${fmt(tot)}${bar(raw,1)}<span class="pl" style="font-size:9.5px">${raw.toFixed(1)}%</span></td><td style="color:${col};font-weight:700">${st}</td><td>${fmt(tg)}</td></tr>`;

function load(){
  spin(true);
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),25000);
  return fetch(SCRIPT_URL,{signal:ctl.signal}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{
    if(!Array.isArray(data))throw 0;
    M.forEach(m=>db.tx[m.k]=[]);db.pay=[];
    data.forEach(i=>{
      const amount=parseFloat(i.amount)||0;
      if(i.target==='sec-payment')db.pay.push({date:i.date,ref:i.ref,senderBank:i.senderBank||i.bankFrom,receiverBank:i.receiverBank||i.bankTo,reason:i.reasonTitle||i.month,amount});
      else if(db.tx[i.target])db.tx[i.target].push({date:i.date,ref:i.ref,bankFrom:i.bankFrom,bankTo:i.bankTo,month:i.month,year:i.year,amount});
    });
    renderAll();spin(false);
  }).catch(()=>{$('loadingTxt').textContent=T[lang].fail;$('retryBtn').hidden=$('closeBtn').hidden=false})
  .finally(()=>clearTimeout(tm));
}

    if(!r.success){spin(false);alert('Error: '+(r.message||''));return}
    alert(t.ok);
    ['inRef','inFrom','inTo','inMonth','inYear','inAmt'].forEach(i=>$(i).value='');
    await load();
    buildMsg(target,amount,when,ref,bf,bt,mo,yr);
  }catch(e){spin(false);alert(t.conn)}
  finally{btn.disabled=false}
}
function buildMsg(target,amount,when,ref,bf,bt,mo,yr){
  const m=M.find(x=>x.k===target),nm=m?m.bn:'সম্পত্তির পরিশোধিত মূল্য';
  let extra='';
  if(m){const tot=db.tx[m.k].reduce((a,i)=>a+i.amount,0),tg=m.s*PER,pct=tg?tot/tg*100:0;
    extra=`👤 *সদস্যের মোট জমা:* ${tot.toFixed(2)} BDT\n📈 *পরিশোধের অগ্রগতি:* ${pct.toFixed(1)}%\n📊 *অবস্থা/বকেয়া:* ${stat(tg-tot,T.bn)[0]}\n`}
  let dep=0;M.forEach(x=>db.tx[x.k].forEach(i=>dep+=i.amount));
  const fund=dep-db.pay.reduce((a,i)=>a+i.amount,0);
  lastMsg=`📢 *বন্ধুত্বের স্মারক সমিতি - নতুন জমা এন্ট্রি*\n\n👤 *নাম/খাত:* ${nm}\n💰 *এবারের জমা:* ${amount.toFixed(2)} BDT\n${extra}📅 *তারিখ:* ${when}\n🔢 *রেফারেন্স নং:* ${ref}\n🏦 *প্রেরক ব্যাংক:* ${bf}\n🏦 *প্রাপক ব্যাংক:* ${bt}\n📌 *মাস/বছর:* ${mo} ${yr}\n\n━━━━━━━━━━━━━━━\n💼 *সমিতির তহবিলে বর্তমান জমা:* ${fund.toFixed(2)} BDT\n━━━━━━━━━━━━━━━\n\n🙏 প্রিয় *${nm}*, আপনাকে অনেক ধন্যবাদ! বিস্তারিত দেখতে ভিজিট করুন: ${SITE}`;
  $('waBtn').href='https://api.whatsapp.com/send?text='+encodeURIComponent(lastMsg);
  $('waBtn').style.display=$('msBtn').style.display='inline-block';
}
function shareMs(){
  if(!lastMsg)return;

  window.open("https://m.me/j/AbYCDokDuB-IvIW_/?send_source=gc%3Acopy_invite_link_t","_blank","noopener");
}

function clock(){
  const n=new Date(),l=lang==='bn'?'bn-BD':'en-US',o=tz?{timeZone:tz}:{};
  try{
    $('clock').textContent=n.toLocaleTimeString(l,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true,...o});
    $('dateV').textContent=n.toLocaleDateString(l,{year:'numeric',month:'short',day:'numeric',...o});
  }catch(e){tz=''}
}
function wx(c,d){
  const b=lang==='bn';
  if(c===0)return d?['☀️',b?'রৌদ্রোজ্জ্বল':'Sunny']:['🌙',b?'পরিষ্কার':'Clear'];
  if(c<=3)return d?['⛅',b?'আংশিক মেঘলা':'Partly Cloudy']:['☁️',b?'মেঘলা':'Cloudy'];
  if(c>=45&&c<=48)return['🌫️',b?'কুয়াশাচ্ছন্ন':'Foggy'];
  if(c>=51&&c<=67)return['🌧️',b?'বৃষ্টি':'Rainy'];
  if(c>=71&&c<=77)return['❄️',b?'তুষারপাত':'Snowy'];
  if(c>=80&&c<=82)return['🌦️',b?'বৃষ্টির ঝাপটা':'Showers'];
  if(c>=95)return['⛈️',b?'ঝড়-বৃষ্টি':'Stormy'];
  return['☀️',b?'রৌদ্রোজ্জ্বল':'Clear'];
}
function showLoc(){
  $('uLoc').textContent=locTxt||T[lang].locF;
  if(wxData){const[i,x]=wx(wxData.c,wxData.d);$('uWx').textContent=`${i} ${wxData.t}°C ${x}`}
  else $('uWx').textContent=T[lang].wxF;
}
async function geo(){
  try{
    const r=await(await fetch('https://ipapi.co/json/')).json();
    locTxt=[r.city,r.country_code].filter(Boolean).join(', ');tz=r.timezone||'';
    if(r.latitude){
      const w=(await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${r.latitude}&longitude=${r.longitude}&current=temperature_2m,weather_code,is_day`)).json()).current;
      wxData={t:Math.round(w.temperature_2m),c:w.weather_code,d:w.is_day};
    }
  }catch(e){}
  showLoc();clock();
}

});
